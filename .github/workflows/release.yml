name: Release

# Compila el BACKEND solo (sin Python) para Windows, macOS y Linux y lo publica
# como assets de un GitHub Release. La app ENTERA (backend + web) se publica desde
# `diagraminder-app`, que es otro repo: esto es para quien quiere solo el backend y
# usar la web. Se dispara al pushear un tag v*
# (ej. v0.1.1). workflow_dispatch corre solo el build (para probar, sin publicar).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # necesario para crear el Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: win,   ext: ".exe", noconsole: "--noconsole" }
          - { os: macos-latest,   name: mac,   ext: "",     noconsole: "" }
          - { os: ubuntu-latest,  name: linux, ext: "",     noconsole: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller certifi
      # --collect-data certifi: sin su cacert.pem adentro TODO HTTPS del binario falla
      # (el `import certifi` vive en un try y PyInstaller no lo detecta solo).
      # --noconsole en Windows: es una app, no un script.
      - run: >
          pyinstaller --onefile ${{ matrix.noconsole }}
          --name DiagraMinder-Backend-${{ matrix.name }}
          --hidden-import certifi --collect-data certifi
          backend/server.py
      - uses: actions/upload-artifact@v4
        with:
          name: DiagraMinder-Backend-${{ matrix.name }}
          path: dist/DiagraMinder-Backend-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # solo publica en tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generar zip (versión script)
        run: bash backend/build_zip.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DiagraMinder-Backend-*
            descargas/Instalar-DiagraMinder-Backend-win.bat
            descargas/Instalar-DiagraMinder-Backend-mac.command
            descargas/Instalar-DiagraMinder-Backend-linux.sh
            descargas/instalar-win.ps1
            diagraminder-backend.zip
